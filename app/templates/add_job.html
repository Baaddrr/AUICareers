<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Job</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
        }

        .navbar {
            background-color: #006400;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h1 {
            color: white;
            margin: 0;
            font-size: 20px;
        }

        .navbar-links {
            display: flex;
            gap: 15px;
        }

        .navbar-button {
            background-color: white;
            color: #006400;
            padding: 8px 16px;
            font-weight: bold;
            border-radius: 5px;
            text-decoration: none;
            transition: background-color 0.3s ease;
        }

        .navbar-button:hover {
            background-color: #e2e8f0;
        }

        .container {
            max-width: 600px;
            margin: 60px auto 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: #006400;
            margin-bottom: 20px;
        }

        form div {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }

        input[type="text"],
        input[type="number"],
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
            resize: vertical;
        }

        textarea {
            height: 100px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

<!-- Green Navbar -->
<div class="navbar">
    <h1>AUICareers Admin</h1>
    <div class="navbar-links">
        <a href="{{ url_for('main.admin_view') }}" class="navbar-button">Home</a>
        <a href="{{ url_for('main.logout') }}" class="navbar-button">Logout</a>
    </div>
</div>

<!-- Job Form -->
<div class="container">
    <h2>Add a New Job</h2>
    <form action="{{ url_for('main.add_job') }}" method="POST">
        <div>
            <label for="company_id">Company ID:</label>
            <input type="number" id="company_id" name="company_id" required>
        </div>
        <div>
            <label for="title">Job Title:</label>
            <input type="text" id="title" name="title" required>
        </div>
        <div>
            <label for="description">Job Description:</label>
            <textarea id="description" name="description" required></textarea>
        </div>
        <div>
            <label for="location">Job Location:</label>
            <input type="text" id="location" name="location" required>
        </div>
        <div>
            <label for="salary">Salary:</label>
            <input type="number" id="salary" name="salary" step="0.01" required>
        </div>
        <div>
            <button type="submit">Add Job</button>
        </div>
    </form>
</div>

</body>
</html>
