<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Jobs</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
        }

        .navbar {
            background-color: #006400;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h1 {
            color: white;
            margin: 0;
            font-size: 20px;
        }

        .navbar-links {
            display: flex;
            gap: 15px;
        }

        .navbar-button {
            background-color: white;
            color: #006400;
            padding: 8px 16px;
            font-weight: bold;
            border-radius: 5px;
            text-decoration: none;
            transition: background-color 0.3s ease;
        }

        .navbar-button:hover {
            background-color: #e2e8f0;
        }

        .container {
            max-width: 900px;
            margin: 60px auto 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: #006400;
            margin-bottom: 20px;
        }

        .add-job-button {
            display: block;
            width: 200px;
            margin: 0 auto 20px auto;
            text-align: center;
            padding: 10px 20px;
            background-color: #006400;
            color: white;
            font-weight: bold;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        .add-job-button:hover {
            background-color: #004d00;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
            font-size: 14px;
        }

        th {
            background-color: #f0f0f0;
        }

        tr:hover {
            background-color: #f9f9f9;
        }

        .btn {
            display: inline-block;
            padding: 8px 12px;
            margin: 2px;
            font-size: 13px;
            text-decoration: none;
            border-radius: 5px;
            cursor: pointer;
            text-align: center;
        }

        .btn-danger {
            background-color: #dc3545;
            color: white;
            border: none;
        }

        .btn-danger:hover {
            background-color: #c82333;
        }

        .btn-warning {
            background-color: #ffc107;
            color: black;
            text-decoration: none;
        }

        .btn-warning:hover {
            background-color: #e0a800;
        }

        p {
            text-align: center;
            color: #777;
        }
    </style>
</head>
<body>

<!-- Green Navbar -->
<div class="navbar">
    <h1>AUICareers Admin</h1>
    <div class="navbar-links">
        <a href="{{ url_for('main.admin_view') }}" class="navbar-button">Home</a>
        <a href="{{ url_for('main.logout') }}" class="navbar-button">Logout</a>
    </div>
</div>

<!-- Content Container -->
<div class="container">
    <h2>All Jobs Posted by You</h2>

    <a href="{{ url_for('main.add_job') }}" class="add-job-button">+ Add New Job</a>

    {% if jobs %}
        <table>
            <thead>
                <tr>
                    <th>Job Title</th>
                    <th>Description</th>
                    <th>Location</th>
                    <th>Salary</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for job in jobs %}
                    <tr>
                        <td>{{ job.title }}</td>
                        <td>{{ job.description }}</td>
                        <td>{{ job.location }}</td>
                        <td>{{ job.salary }}</td>
                        <td>
                            <form action="{{ url_for('main.delete_job', job_id=job.job_id) }}" method="post" style="display:inline;" onsubmit="return confirm('Are you sure you want to delete this job?');">
                                <button type="submit" class="btn btn-danger">Delete</button>
                            </form>
                            <a href="{{ url_for('main.update_job', job_id=job.job_id) }}" class="btn btn-warning">Edit</a>
                        </td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    {% else %}
        <p>No jobs available.</p>
    {% endif %}
</div>

</body>
</html>
