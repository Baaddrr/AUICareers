<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f3f4f6;
        }

        .navbar {
            background-color: #006400;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h1 {
            color: white;
            margin: 0;
            font-size: 20px;
        }

        .navbar-links {
            display: flex;
            gap: 15px;
        }

        .navbar-button {
            background-color: white;
            color: #006400;
            padding: 8px 16px;
            font-weight: bold;
            border-radius: 5px;
            text-decoration: none;
            transition: background-color 0.3s ease;
        }

        .navbar-button:hover {
            background-color: #e2e8f0;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: #006400;
            margin-bottom: 20px;
        }

        .description {
            text-align: center;
            color: #555;
            margin-bottom: 30px;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .button-link {
            width: 100%;
            max-width: 250px;
            padding: 12px 20px;
            background-color: #006400;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        .button-link:hover {
            background-color: #004d00;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<div class="navbar">
    <h1>AUICareers Admin</h1>
    <div class="navbar-links">
        <a href="{{ url_for('main.admin_profile') }}" class="navbar-button">Profile</a>
        <a href="{{ url_for('main.logout') }}" class="navbar-button">Logout</a>
    </div>
</div>

<div class="container">
    <h2>Admin Dashboard</h2>
    <p class="description">You have full access to manage job listings, view applications, and oversee the platform.</p>

    <div class="button-group">
        <a class="button-link" href="{{ url_for('main.create_job') }}">Create a Job</a>
        <a class="button-link" href="{{ url_for('main.admin_jobs') }}">View All Jobs</a>
        <a class="button-link" href="{{ url_for('main.view_applications') }}">View Applications</a>
        <a class="button-link" href="{{ url_for('main.schedule_interview') }}">Schedule Job Interviews</a>
        <a class="button-link" href="{{ url_for('main.admin_view_interviews') }}">View Job Interviews</a> 

    </div>
</div>

</body>
</html>
