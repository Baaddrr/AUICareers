{% extends 'base.html' %}

{% block content %}
  <style>
    .container {
      max-width: 600px;
      margin: 60px auto 0 auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    h2 {
      text-align: center;
      color: #006400;
      margin-bottom: 25px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #333;
    }
    input[type="text"],
    input[type="number"],
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 14px;
    }
    textarea {
      resize: vertical;
      min-height: 100px;
    }
    .btn {
      display: inline-block;
      padding: 10px 20px;
      font-size: 14px;
      border: none;
      border-radius: 5px;
      text-decoration: none;
      text-align: center;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-primary {
      background-color: #006400;
      color: white;
    }
    .btn-primary:hover {
      background-color: #008c00;
    }
    .btn-secondary {
      background-color: #6c757d;
      color: white;
      text-decoration: none;
      padding: 10px 20px;
      margin-left: 10px;
    }
    .btn-secondary:hover {
      background-color: #5a6268;
    }
  </style>

  <div class="container">
    <h2>Edit Job</h2>
    <form method="POST">
      <div class="form-group">
        <label for="company_id">Company ID</label>
        <input type="number" id="company_id" name="company_id" value="{{ job.company_id }}" required>
      </div>

      <div class="form-group">
        <label for="title">Job Title</label>
        <input type="text" id="title" name="title" value="{{ job.title }}" required>
      </div>

      <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" name="description" required>{{ job.description }}</textarea>
      </div>

      <div class="form-group">
        <label for="location">Location</label>
        <input type="text" id="location" name="location" value="{{ job.location }}" required>
      </div>

      <div class="form-group">
        <label for="salary">Salary</label>
        <input type="text" id="salary" name="salary" value="{{ job.salary }}" required>
      </div>

      <button type="submit" class="btn btn-primary">Update Job</button>
      <a href="{{ url_for('main.admin_jobs') }}" class="btn btn-secondary">Cancel</a>
    </form>
  </div>
{% endblock %}
