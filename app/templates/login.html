{% extends 'base.html' %}

{% block content %}
<div class="min-h-screen bg-gray-100 flex items-center justify-center">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-sm">
        <h1 class="text-3xl font-bold text-green-800 text-center mb-2">AUICareers</h1>
        <h2 class="text-xl font-semibold text-gray-800 text-center mb-6">Welcome Back</h2>

        <form method="POST">
            <div class="mb-4">
                <label for="email" class="block text-sm text-gray-700">Email Address</label>
                <input type="email" id="email" name="email" required
                       class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-600">
            </div>
            <div class="mb-4">
                <label for="password" class="block text-sm text-gray-700">Password</label>
                <input type="password" id="password" name="password" required
                       class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-600">
            </div>
            <button type="submit"
                    class="w-full bg-green-700 hover:bg-green-800 text-white font-semibold py-2 rounded-md transition">
                Log In
            </button>
        </form>

        <p class="text-center text-sm mt-6 text-gray-600">
            Don't have an account?
            <a href="{{ url_for('main.signup') }}" class="text-green-700 font-medium hover:underline">Sign up</a>
        </p>
    </div>
</div>
{% endblock %}
