<!DOCTYPE html>
<html>
<head>
    <title>Update Admin Profile</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f3f4f6;
            margin: 0;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: #006400;
            margin-bottom: 20px;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-top: 10px;
            font-weight: bold;
        }

        input[type="text"] {
            padding: 10px;
            margin-top: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            margin-top: 20px;
            padding: 12px;
            background-color: #006400;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #004d00;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Update Profile</h2>
    <form method="POST">
        <label for="department">Department:</label>
        <input type="text" name="department" value="{{ admin.department or '' }}" required>

        <label for="phone_number">Phone Number:</label>
        <input type="text" name="phone_number" value="{{ admin.phone_number or '' }}" required>

        <button type="submit">Save Changes</button>
    </form>
</div>

</body>
</html>
