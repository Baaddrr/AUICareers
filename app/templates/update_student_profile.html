{% extends "base.html" %}

{% block content %}
<div class="min-h-screen bg-gray-100">
    <nav class="bg-green-700 py-4">
        <div class="max-w-6xl mx-auto px-4 flex justify-between items-center">
            <a href="{{ url_for('main.student_profile') }}" class="text-white font-semibold hover:underline">Back to Profile</a>
            <a href="{{ url_for('main.logout') }}" class="text-white font-semibold hover:underline">Logout</a>
        </div>
    </nav>

    <div class="max-w-2xl mx-auto mt-12 p-6 bg-white shadow-lg rounded-xl">
        <h2 class="text-2xl font-bold text-green-700 text-center mb-6">Update Profile</h2>

        <form method="POST" action="{{ url_for('main.update_student_profile') }}">
            <div class="mb-4">
                <label class="block text-gray-700 font-semibold mb-2" for="major">Major</label>
                <input type="text" id="major" name="major" value="{{ student.major or '' }}" class="w-full p-2 border rounded" />
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 font-semibold mb-2" for="graduation_year">Graduation Year</label>
                <input type="text" id="graduation_year" name="graduation_year" value="{{ student.graduation_year or '' }}" class="w-full p-2 border rounded" />
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 font-semibold mb-2" for="bio">Bio</label>
                <textarea id="bio" name="bio" class="w-full p-2 border rounded" rows="4">{{ student.bio or '' }}</textarea>
            </div>

            <button type="submit" class="w-full py-2 bg-green-800 text-white font-semibold rounded-md hover:bg-green-900">Save Changes</button>
        </form>
    </div>
</div>
{% endblock %}
